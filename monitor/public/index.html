<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code Monitor</title>
    <style>
      :root {
        --bg: #0a0e14;
        --panel: #111823;
        --panel-2: #0d141d;
        --line: #1e2a3a;
        --text: #dbe5f0;
        --muted: #7c8ea3;
        --dim: #55697f;
        --working: #34d399;
        --permission: #fbbf24;
        --waiting: #60a5fa;
        --error: #f87171;
        --idle: #64748b;
        --stopped: #3f4c5e;
      }
      * { box-sizing: border-box; }
      /* display を指定した要素にも hidden を効かせる（.tool の flex に負けるため）。 */
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 14px 20px; border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #101823, #0b1119);
        position: sticky; top: 0; z-index: 10;
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: .02em; font-weight: 650; }
      .stats { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
      .stat { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); }
      .stat b { font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
      .conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
      .conn i {
        width: 8px; height: 8px; border-radius: 50%; background: var(--error);
        display: inline-block; transition: background .3s;
      }
      .conn.live i { background: var(--working); }

      main {
        display: grid; grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px; padding: 18px 20px; align-items: start;
      }
      @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }

      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 13px 14px; position: relative; overflow: hidden;
      }
      .card::before {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
        background: var(--c); opacity: .9;
      }
      /* ツール実行の合図。派手すぎないよう淡く 1 回だけ差す。 */
      .card.flash { animation: flash 1s ease-out; }
      @keyframes flash {
        0% { background: color-mix(in srgb, var(--c) 10%, var(--panel)); }
        100% { background: var(--panel); }
      }
      .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .project { font-weight: 650; font-size: 14px; letter-spacing: .01em; }
      .branch {
        font-size: 11px; color: var(--muted); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
      }
      .badge {
        margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 600; color: var(--c);
        background: color-mix(in srgb, var(--c) 13%, transparent);
        border: 1px solid color-mix(in srgb, var(--c) 32%, transparent);
        border-radius: 20px; padding: 2px 9px 2px 7px; white-space: nowrap;
      }
      .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
      .badge.animate i { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

      .title { font-size: 13px; color: var(--text); margin-bottom: 7px; min-height: 20px; }
      .title.empty { color: var(--dim); }
      .tool {
        display: flex; align-items: center; gap: 6px; font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--working); margin-bottom: 7px;
      }
      .tool .spinner {
        width: 9px; height: 9px; flex: none;
        border: 1.5px solid color-mix(in srgb, var(--working) 30%, transparent);
        border-top-color: var(--working); border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .detail { font-size: 12px; color: var(--permission); margin-bottom: 7px; }
      .meta {
        display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--dim);
        border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .meta span { white-space: nowrap; }
      .tools-trail { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; min-height: 18px; }
      .chip {
        font-size: 10px; color: var(--muted); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .chip.last { color: var(--text); border-color: color-mix(in srgb, var(--c) 40%, var(--line)); }

      aside {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        display: flex; flex-direction: column; max-height: calc(100vh - 100px); position: sticky; top: 82px;
      }
      aside h2 {
        font-size: 12px; margin: 0; padding: 11px 13px; border-bottom: 1px solid var(--line);
        color: var(--muted); font-weight: 600; letter-spacing: .04em;
      }
      #feed { overflow-y: auto; padding: 8px 6px 10px; }
      .item {
        display: grid; grid-template-columns: 52px 1fr; gap: 8px;
        padding: 5px 8px; border-radius: 6px; font-size: 12px;
        animation: slide .25s ease-out;
      }
      @keyframes slide { from { opacity: 0; } to { opacity: 1; } }
      .item time { color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
      .item .body { min-width: 0; }
      .item .proj { font-size: 10.5px; color: var(--k); font-weight: 600; }
      .item .txt { color: var(--muted); overflow-wrap: anywhere; }
      .item.tool .txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb4cc; }
      .item.status .txt { color: var(--text); }
      .item.prompt .txt { color: #c9b6f0; }

      .empty-state { color: var(--dim); padding: 40px 0; text-align: center; font-size: 13px; }

      @media (prefers-reduced-motion: reduce) {
        .badge.animate i, .card.flash, .tool .spinner, .item { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Claude Code Monitor</h1>
      <div class="conn" id="conn"><i></i><span>接続中…</span></div>
      <div class="stats">
        <div class="stat"><b id="s-working">0</b> 稼働</div>
        <div class="stat"><b id="s-attention">0</b> 要対応</div>
        <div class="stat"><b id="s-idle">0</b> 待機</div>
        <div class="stat"><b id="s-total">0</b> 合計</div>
      </div>
    </header>

    <main>
      <div class="grid" id="grid"><div class="empty-state">セッションを探しています…</div></div>
      <aside>
        <h2>ライブフィード</h2>
        <div id="feed"></div>
      </aside>
    </main>

    <script>
      const STATUS = {
        working:    { label: "稼働中",   color: "var(--working)",    animate: true },
        permission: { label: "権限待ち", color: "var(--permission)", animate: true },
        waiting:    { label: "入力待ち", color: "var(--waiting)",    animate: true },
        error:      { label: "エラー",   color: "var(--error)",      animate: true },
        idle:       { label: "待機",     color: "var(--idle)",       animate: false },
        stopped:    { label: "終了",     color: "var(--stopped)",    animate: false },
      };
      const KIND_COLOR = {
        tool: "#7dd3fc", prompt: "#c9b6f0", message: "#94a3b8",
        status: "#fbbf24", session: "#34d399", agent: "#f0abfc",
      };
      /** ツールが連続しても、この間隔より短いフラッシュは間引く。 */
      const FLASH_COOLDOWN_MS = 1500;

      const grid = document.getElementById("grid");
      const feedEl = document.getElementById("feed");
      const conn = document.getElementById("conn");
      const cards = new Map();
      const lastFlash = new Map();
      let sessions = [];

      const pad = (n) => String(n).padStart(2, "0");
      const clock = (ts) => {
        const d = new Date(ts);
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      };
      function ago(ts) {
        if (!ts) return "—";
        const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (s < 60) return `${s}秒前`;
        if (s < 3600) return `${Math.floor(s / 60)}分前`;
        if (s < 86400) return `${Math.floor(s / 3600)}時間前`;
        return `${Math.floor(s / 86400)}日前`;
      }
      function dur(ts) {
        if (!ts) return "—";
        const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        return h > 0 ? `${h}時間${m}分` : `${m}分`;
      }
      const kilo = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n));

      /** 値が変わった時だけ書き換える。毎回代入すると再描画とアニメ再開を招く。 */
      const setText = (node, text) => { if (node.textContent !== text) node.textContent = text; };
      const setShown = (node, shown) => { if (node.hidden === shown) node.hidden = !shown; };

      /** カードは 1 度だけ組み立て、以後は中身を差分更新する。 */
      function buildCard() {
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div class="card-top">
            <span class="project"></span>
            <span class="branch" hidden></span>
            <span class="badge"><i></i><span class="badge-label"></span></span>
          </div>
          <div class="title"></div>
          <div class="tool" hidden><span class="spinner"></span><span class="tool-name"></span></div>
          <div class="detail" hidden></div>
          <div class="tools-trail"></div>
          <div class="meta">
            <span class="m-activity"></span><span class="m-uptime"></span>
            <span class="m-cache" hidden></span><span class="m-agents" hidden></span>
            <span class="m-source"></span>
          </div>`;
        const q = (sel) => el.querySelector(sel);
        return {
          el, trailKey: "",
          project: q(".project"), branch: q(".branch"),
          badge: q(".badge"), badgeLabel: q(".badge-label"),
          title: q(".title"), tool: q(".tool"), toolName: q(".tool-name"),
          detail: q(".detail"), trail: q(".tools-trail"),
          activity: q(".m-activity"), uptime: q(".m-uptime"),
          cache: q(".m-cache"), agents: q(".m-agents"), source: q(".m-source"),
        };
      }

      function paint(c, s) {
        const st = STATUS[s.status] ?? STATUS.idle;
        if (c.el.style.getPropertyValue("--c") !== st.color) c.el.style.setProperty("--c", st.color);

        setText(c.project, s.project);
        setText(c.branch, s.branch ?? "");
        setShown(c.branch, Boolean(s.branch));

        setText(c.badgeLabel, st.label);
        c.badge.classList.toggle("animate", st.animate);

        setText(c.title, s.title ?? "（作業内容 未確定）");
        c.title.classList.toggle("empty", !s.title);

        setShown(c.tool, Boolean(s.currentTool));
        if (s.currentTool) setText(c.toolName, `${s.currentTool} 実行中`);

        const showDetail = Boolean(s.statusDetail) && s.status !== "working";
        setShown(c.detail, showDetail);
        if (showDetail) setText(c.detail, s.statusDetail);

        const trail = s.recentTools.slice(-6);
        const key = trail.join("␀");
        if (key !== c.trailKey) {
          c.trailKey = key;
          c.trail.replaceChildren(...trail.map((t, i) => {
            const chip = document.createElement("span");
            chip.className = i === trail.length - 1 ? "chip last" : "chip";
            chip.textContent = t;
            return chip;
          }));
        }

        setText(c.activity, `最終活動 ${ago(s.lastActivityAt)}`);
        setText(c.uptime, `稼働 ${dur(s.startedAt)}`);
        setShown(c.cache, Boolean(s.tokens));
        if (s.tokens) setText(c.cache, `キャッシュ ${kilo(s.tokens.cacheRead)}`);
        setShown(c.agents, s.activeAgents > 0);
        if (s.activeAgents) setText(c.agents, `サブエージェント ${s.activeAgents}`);
        setText(c.source, s.statusSource === "hook" ? "hook" : "log");
      }

      function render(list) {
        sessions = list;
        if (!list.length) {
          if (!grid.querySelector(".empty-state")) {
            grid.replaceChildren(Object.assign(document.createElement("div"), {
              className: "empty-state",
              textContent: "稼働中の Claude Code セッションがありません",
            }));
          }
          cards.clear();
          stats(list);
          return;
        }
        const placeholder = grid.querySelector(".empty-state");
        if (placeholder) { grid.replaceChildren(); cards.clear(); }

        list.forEach((s, i) => {
          let c = cards.get(s.sessionId);
          if (!c) { c = buildCard(); cards.set(s.sessionId, c); }
          paint(c, s);
          // 並び順が変わった時だけ動かす（無条件の appendChild は再挿入でアニメを乱す）。
          if (grid.children[i] !== c.el) grid.insertBefore(c.el, grid.children[i] ?? null);
        });
        for (const [id, c] of cards) {
          if (!list.some((s) => s.sessionId === id)) { c.el.remove(); cards.delete(id); }
        }
        stats(list);
      }

      function stats(list) {
        const by = (f) => String(list.filter(f).length);
        setText(document.getElementById("s-working"), by((s) => s.status === "working"));
        setText(document.getElementById("s-attention"),
          by((s) => ["permission", "waiting", "error"].includes(s.status)));
        setText(document.getElementById("s-idle"), by((s) => s.status === "idle"));
        setText(document.getElementById("s-total"), by((s) => s.alive));
      }

      function addFeed(item, prepend = true) {
        const el = document.createElement("div");
        el.className = `item ${item.kind}`;
        el.style.setProperty("--k", KIND_COLOR[item.kind] ?? "#94a3b8");
        const time = document.createElement("time");
        time.textContent = clock(item.at);
        const body = document.createElement("div");
        body.className = "body";
        const proj = document.createElement("div");
        proj.className = "proj";
        proj.textContent = item.project;
        const txt = document.createElement("div");
        txt.className = "txt";
        txt.textContent = item.text;
        body.append(proj, txt);
        el.append(time, body);
        if (prepend) feedEl.prepend(el); else feedEl.appendChild(el);
        while (feedEl.childElementCount > 150) feedEl.lastElementChild.remove();

        if (item.kind !== "tool") return;
        const c = cards.get(item.sessionId);
        const now = Date.now();
        if (!c || now - (lastFlash.get(item.sessionId) ?? 0) < FLASH_COOLDOWN_MS) return;
        lastFlash.set(item.sessionId, now);
        c.el.classList.remove("flash");
        void c.el.offsetWidth; // アニメを再生させるためリフローを挟む
        c.el.classList.add("flash");
      }

      function connect() {
        const es = new EventSource("/events");
        es.addEventListener("open", () => {
          conn.className = "conn live";
          setText(conn.querySelector("span"), "リアルタイム接続");
        });
        es.addEventListener("sessions", (e) => render(JSON.parse(e.data)));
        es.addEventListener("feed", (e) => addFeed(JSON.parse(e.data)));
        es.addEventListener("feed-batch", (e) => {
          feedEl.replaceChildren();
          for (const item of JSON.parse(e.data).reverse()) addFeed(item, false);
        });
        es.addEventListener("error", () => {
          conn.className = "conn";
          setText(conn.querySelector("span"), "再接続中…");
        });
      }

      connect();
      // 経過時間の表示だけを進める。カードは作り直さない。
      setInterval(() => {
        for (const s of sessions) {
          const c = cards.get(s.sessionId);
          if (!c) continue;
          setText(c.activity, `最終活動 ${ago(s.lastActivityAt)}`);
          setText(c.uptime, `稼働 ${dur(s.startedAt)}`);
        }
      }, 1000);
    </script>
  </body>
</html>
