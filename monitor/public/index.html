<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code Monitor</title>
    <style>
      :root {
        --bg: #0a0e14;
        --panel: #111823;
        --panel-2: #0d141d;
        --line: #1e2a3a;
        --text: #dbe5f0;
        --muted: #7c8ea3;
        --dim: #55697f;
        --working: #34d399;
        --permission: #fbbf24;
        --waiting: #60a5fa;
        --error: #f87171;
        --idle: #64748b;
        --stopped: #3f4c5e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 14px 20px; border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #101823, #0b1119);
        position: sticky; top: 0; z-index: 10;
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: .02em; font-weight: 650; }
      .stats { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
      .stat { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); }
      .stat b { font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
      .conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
      .conn i {
        width: 8px; height: 8px; border-radius: 50%; background: var(--error);
        display: inline-block; transition: background .3s;
      }
      .conn.live i { background: var(--working); animation: pulse 2s infinite; }

      main {
        display: grid; grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px; padding: 18px 20px; align-items: start;
      }
      @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }

      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 13px 14px; position: relative; overflow: hidden;
        transition: border-color .3s, transform .12s;
      }
      .card::before {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
        background: var(--c); opacity: .9;
      }
      .card.flash { animation: flash .55s ease-out; }
      @keyframes flash {
        0% { background: color-mix(in srgb, var(--c) 22%, var(--panel)); }
        100% { background: var(--panel); }
      }
      .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .project { font-weight: 650; font-size: 14px; letter-spacing: .01em; }
      .branch {
        font-size: 11px; color: var(--muted); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
      }
      .badge {
        margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 600; color: var(--c);
        background: color-mix(in srgb, var(--c) 13%, transparent);
        border: 1px solid color-mix(in srgb, var(--c) 32%, transparent);
        border-radius: 20px; padding: 2px 9px 2px 7px; white-space: nowrap;
      }
      .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
      .badge.animate i { animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

      .title { font-size: 13px; color: var(--text); margin-bottom: 7px; min-height: 20px; }
      .title.empty { color: var(--dim); }
      .tool {
        display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--working); margin-bottom: 7px;
      }
      .tool .spinner {
        width: 9px; height: 9px; border: 1.5px solid color-mix(in srgb, var(--working) 30%, transparent);
        border-top-color: var(--working); border-radius: 50%; animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .detail { font-size: 12px; color: var(--permission); margin-bottom: 7px; }
      .meta {
        display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--dim);
        border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .meta span { white-space: nowrap; }
      .tools-trail {
        display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; min-height: 18px;
      }
      .chip {
        font-size: 10px; color: var(--muted); background: var(--panel-2);
        border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .chip.last { color: var(--text); border-color: color-mix(in srgb, var(--c) 40%, var(--line)); }

      aside {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        display: flex; flex-direction: column; max-height: calc(100vh - 100px); position: sticky; top: 82px;
      }
      aside h2 {
        font-size: 12px; margin: 0; padding: 11px 13px; border-bottom: 1px solid var(--line);
        color: var(--muted); font-weight: 600; letter-spacing: .04em;
      }
      #feed { overflow-y: auto; padding: 8px 6px 10px; }
      .item {
        display: grid; grid-template-columns: 52px 1fr; gap: 8px;
        padding: 5px 8px; border-radius: 6px; font-size: 12px;
        animation: slide .3s ease-out;
      }
      @keyframes slide { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
      .item time { color: var(--dim); font-size: 10.5px; font-variant-numeric: tabular-nums; padding-top: 1px; }
      .item .body { min-width: 0; }
      .item .proj { font-size: 10.5px; color: var(--k); font-weight: 600; }
      .item .txt { color: var(--muted); overflow-wrap: anywhere; }
      .item.tool .txt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #9fb4cc; }
      .item.status .txt { color: var(--text); }
      .item.prompt .txt { color: #c9b6f0; }

      .empty-state { color: var(--dim); padding: 40px 0; text-align: center; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Claude Code Monitor</h1>
      <div class="conn" id="conn"><i></i><span>接続中…</span></div>
      <div class="stats">
        <div class="stat"><b id="s-working">0</b> 稼働</div>
        <div class="stat"><b id="s-attention">0</b> 要対応</div>
        <div class="stat"><b id="s-idle">0</b> 待機</div>
        <div class="stat"><b id="s-total">0</b> 合計</div>
      </div>
    </header>

    <main>
      <div class="grid" id="grid"><div class="empty-state">セッションを探しています…</div></div>
      <aside>
        <h2>ライブフィード</h2>
        <div id="feed"></div>
      </aside>
    </main>

    <script>
      const STATUS = {
        working:    { label: "稼働中",   color: "var(--working)",    animate: true },
        permission: { label: "権限待ち", color: "var(--permission)", animate: true },
        waiting:    { label: "入力待ち", color: "var(--waiting)",    animate: true },
        error:      { label: "エラー",   color: "var(--error)",      animate: true },
        idle:       { label: "待機",     color: "var(--idle)",       animate: false },
        stopped:    { label: "終了",     color: "var(--stopped)",    animate: false },
      };
      const KIND_COLOR = {
        tool: "#7dd3fc", prompt: "#c9b6f0", message: "#94a3b8",
        status: "#fbbf24", session: "#34d399", agent: "#f0abfc",
      };

      const grid = document.getElementById("grid");
      const feedEl = document.getElementById("feed");
      const conn = document.getElementById("conn");
      const cards = new Map();
      let sessions = [];

      const pad = (n) => String(n).padStart(2, "0");
      const clock = (ts) => {
        const d = new Date(ts);
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      };
      function ago(ts) {
        if (!ts) return "—";
        const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (s < 60) return `${s}秒前`;
        if (s < 3600) return `${Math.floor(s / 60)}分前`;
        if (s < 86400) return `${Math.floor(s / 3600)}時間前`;
        return `${Math.floor(s / 86400)}日前`;
      }
      function dur(ts) {
        if (!ts) return "—";
        const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        return h > 0 ? `${h}時間${m}分` : `${m}分`;
      }
      const kilo = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n));

      function render(list) {
        sessions = list;
        if (!list.length) {
          grid.innerHTML = '<div class="empty-state">稼働中の Claude Code セッションがありません</div>';
          cards.clear();
        } else {
          const empty = grid.querySelector(".empty-state");
          if (empty) { grid.innerHTML = ""; cards.clear(); }
          for (const s of list) {
            let card = cards.get(s.sessionId);
            if (!card) {
              card = document.createElement("div");
              card.className = "card";
              cards.set(s.sessionId, card);
            }
            paint(card, s);
            grid.appendChild(card); // 並び順を状態順に保つ
          }
          for (const [id, card] of cards) {
            if (!list.some((s) => s.sessionId === id)) { card.remove(); cards.delete(id); }
          }
        }
        stats(list);
      }

      function paint(card, s) {
        const st = STATUS[s.status] ?? STATUS.idle;
        card.style.setProperty("--c", st.color);
        const trail = s.recentTools.slice(-6);
        card.innerHTML = `
          <div class="card-top">
            <span class="project">${esc(s.project)}</span>
            ${s.branch ? `<span class="branch">${esc(s.branch)}</span>` : ""}
            <span class="badge ${st.animate ? "animate" : ""}"><i></i>${st.label}</span>
          </div>
          <div class="title ${s.title ? "" : "empty"}">${esc(s.title ?? "（作業内容 未確定）")}</div>
          ${s.currentTool ? `<div class="tool"><span class="spinner"></span>${esc(s.currentTool)} 実行中</div>` : ""}
          ${s.statusDetail && s.status !== "working" ? `<div class="detail">${esc(s.statusDetail)}</div>` : ""}
          <div class="tools-trail">
            ${trail.map((t, i) => `<span class="chip ${i === trail.length - 1 ? "last" : ""}">${esc(t)}</span>`).join("")}
          </div>
          <div class="meta">
            <span>最終活動 ${ago(s.lastActivityAt)}</span>
            <span>稼働 ${dur(s.startedAt)}</span>
            ${s.tokens ? `<span>キャッシュ ${kilo(s.tokens.cacheRead)}</span>` : ""}
            ${s.activeAgents ? `<span>サブエージェント ${s.activeAgents}</span>` : ""}
            <span>${s.statusSource === "hook" ? "hook" : "log"}</span>
          </div>`;
      }

      function stats(list) {
        const by = (f) => list.filter(f).length;
        document.getElementById("s-working").textContent = by((s) => s.status === "working");
        document.getElementById("s-attention").textContent = by((s) =>
          ["permission", "waiting", "error"].includes(s.status));
        document.getElementById("s-idle").textContent = by((s) => s.status === "idle");
        document.getElementById("s-total").textContent = list.filter((s) => s.alive).length;
      }

      function addFeed(item, prepend = true) {
        const el = document.createElement("div");
        el.className = `item ${item.kind}`;
        el.style.setProperty("--k", KIND_COLOR[item.kind] ?? "#94a3b8");
        el.innerHTML = `<time>${clock(item.at)}</time>
          <div class="body"><div class="proj">${esc(item.project)}</div>
          <div class="txt">${esc(item.text)}</div></div>`;
        if (prepend) feedEl.prepend(el); else feedEl.appendChild(el);
        while (feedEl.childElementCount > 150) feedEl.lastElementChild.remove();

        const card = cards.get(item.sessionId);
        if (card && item.kind === "tool") {
          card.classList.remove("flash");
          void card.offsetWidth; // アニメを再生させるためリフローを挟む
          card.classList.add("flash");
        }
      }

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function connect() {
        const es = new EventSource("/events");
        es.addEventListener("open", () => {
          conn.className = "conn live";
          conn.querySelector("span").textContent = "リアルタイム接続";
        });
        es.addEventListener("sessions", (e) => render(JSON.parse(e.data)));
        es.addEventListener("feed", (e) => addFeed(JSON.parse(e.data)));
        es.addEventListener("feed-batch", (e) => {
          feedEl.innerHTML = "";
          for (const item of JSON.parse(e.data).reverse()) addFeed(item, false);
        });
        es.addEventListener("error", () => {
          conn.className = "conn";
          conn.querySelector("span").textContent = "再接続中…";
        });
      }

      connect();
      // 経過時間の表示だけはサーバーを待たずに進める。
      setInterval(() => { if (sessions.length) render(sessions); }, 1000);
    </script>
  </body>
</html>
